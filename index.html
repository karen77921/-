<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>十分钟八秒</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <img src="avatar.png" alt="头像" class="avatar" />
    <h1 class="title">十分钟八秒</h1>

    <div class="search-box">
      <input type="text" placeholder="搜索资源..." />
    </div>

    <div class="menu">
      <a href="index.html" class="menu-btn active">全部</a>
      <a href="album.html" class="menu-btn">专辑</a>
      <a href="drama.html" class="menu-btn">电视剧</a>
      <a href="movie.html" class="menu-btn">电影</a>
      <a href="concert.html" class="menu-btn">演唱会</a>
    </div>

    <!-- 专辑 -->
    <a href="album.html" class="section-link">
      <div class="section">
        <h2>《专辑》</h2>
        <p>Billkin 最新音乐专辑，收录多首动人情歌。</p>
        <button class="enter">进入</button>
      </div>
    </a>

    <!-- 电视剧 -->
    <a href="drama.html" class="section-link">
      <div class="section">
        <h2>《电视剧》</h2>
        <p>泰国 BL 热剧，Billkin 饰演主角。</p>
        <button class="enter">进入</button>
      </div>
    </a>

    <!-- 电影 -->
    <a href="movie.html" class="section-link">
      <div class="section">
        <h2>《姥姥的外孙》</h2>
        <p>
          Billkin 主演电影《姥姥的外孙》，<br />
          讲述一段温暖治愈的祖孙亲情故事。
        </p>
        <button class="enter">进入</button>
      </div>
    </a>

    <!-- 演唱会 -->
    <a href="concert.html" class="section-link">
      <div class="section">
        <h2>《Tempo》</h2>
        <p>
          Billkin 首个个人演唱会 “Tempo”，<br />
          用音乐讲述成长与热爱。
        </p>
        <button class="enter">进入</button>
      </div>
    </a>
  </div>

  <audio id="bgm" loop>
    <source src="your-music.mp3" type="audio/mpeg" />
    您的浏览器不支持 audio 标签。
  </audio>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const bgm = document.getElementById('bgm');
      const playAttempt = bgm.play();
      if (playAttempt !== undefined) {
        playAttempt
          .then(() => console.log("✅ 音乐自动播放成功"))
          .catch(() => {
            console.log("❌ 自动播放失败，等待用户点击");
            const unlock = () => {
              bgm.play();
              document.removeEventListener('click', unlock);
            };
            document.addEventListener('click', unlock);
          });
      }
    });
  </script>
</body>
</html>
