<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>十分钟八秒</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <img src="avatar.png" alt="头像" class="avatar" />

    <h1 class="title">十分钟八秒</h1>

    <div class="search-box">
      <input type="text" placeholder="搜索资源..." />
    </div>

    <div class="menu">
      <a href="#" class="menu-btn active">全部</a>
      <a href="#" class="menu-btn">专辑</a>
      <a href="#" class="menu-btn">电视剧</a>
      <a href="#" class="menu-btn">电影</a>
      <a href="#" class="menu-btn">演唱会</a>
    </div>

    <!-- 专辑 -->
    <div class="section">
      <h2>《专辑》</h2>
      <p>Billkin 最新音乐专辑，收录多首动人情歌。</p>
      <a class="enter" href="album.html">进入</a>
    </div>

    <!-- 电视剧 -->
    <div class="section">
      <h2>《电视剧》</h2>
      <p>泰国 BL 热剧，Billkin 饰演主角。</p>
      <a class="enter" href="drama.html">进入</a>
    </div>

    <!-- 电影 -->
    <div class="section">
      <h2>《姥姥的外孙》</h2>
      <p>Billkin 主演电影，讲述一段温暖治愈的祖孙亲情故事。</p>
      <a class="enter" href="movie.html">进入</a>
    </div>

    <!-- 演唱会 -->
    <div class="section">
      <h2>《Tempo》</h2>
      <p>Billkin 首个个人演唱会，展现其独特的舞台魅力。</p>
      <a class="enter" href="concert.html">进入</a>
    </div>
  </div>

  <!-- 音乐播放器 -->
  <audio id="bgm" loop>
    <source src="https://files.catbox.moe/76z7ns.mp3" type="audio/mpeg">
    您的浏览器不支持 audio 标签。
  </audio>
  <button class="music-btn" onclick="document.getElementById('bgm').play()">播放音乐 🎵</button>

  <!-- 自动播放处理 -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const bgm = document.getElementById('bgm');
      const playAttempt = bgm.play();
      if (playAttempt !== undefined) {
        playAttempt.catch(() => {
          document.body.addEventListener('click', function unlock() {
            bgm.play();
            document.body.removeEventListener('click', unlock);
          });
        });
      }
    });
  </script>
</body>
</html>
